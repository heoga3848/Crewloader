name: Build mod Hitbox

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - name: Escribir el mod
        run: |
          mkdir mod && cd mod
          cat > crew_mod_api.h <<'EOF'
          #pragma once
          #include <jni.h>
          #include <stdint.h>
          #define CREW_API_VERSION 1
          typedef struct CrewApi {
              uint32_t version;
              JavaVM* vm;
              void (*log)(int priority, const char* tag, const char* message);
          } CrewApi;
          #define CREW_MOD_ENTRY extern "C" __attribute__((visibility("default"))) void crew_mod_init(const CrewApi* api)
          EOF
          cat > mod.cpp <<'EOF'
          #include "crew_mod_api.h"
          #include <android/log.h>
          #include <dlfcn.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <math.h>
          #include <string.h>
          #define TAG "CrewHitbox"
          static JavaVM* g_vm;
          typedef void* (*t_domain_get)();
          typedef void* (*t_thread_attach)(void*);
          typedef void** (*t_get_assemblies)(void*, size_t*);
          typedef void* (*t_asm_image)(void*);
          typedef void* (*t_class_from_name)(void*, const char*, const char*);
          typedef void* (*t_method_from_name)(void*, const char*, int);
          typedef void* (*t_runtime_invoke)(void*, void*, void**, void**);
          typedef void (*t_field_static_get)(void*, void*);
          typedef void* (*t_class_get_field)(void*, const char*);
          static void* sym(void* h, const char* n) {
              char b[128]; snprintf(b, sizeof b, "il2cpp_%s", n);
              return dlsym(h, b);
          }
          struct Vec3 { float x, y, z; };
          struct Color4 { float r, g, b, a; };
          static void* worker(void*) {
              JNIEnv* env = nullptr;
              g_vm->AttachCurrentThread(&env, nullptr);
              void* h = nullptr;
              for (int i = 0; i < 120 && !h; i++) {
                  h = dlopen("libil2cpp.so", RTLD_NOW | RTLD_NOLOAD);
                  if (!h) sleep(1);
              }
              if (!h) return nullptr;
              auto domain_get = (t_domain_get)sym(h, "domain_get");
              auto thread_attach = (t_thread_attach)sym(h, "thread_attach");
              auto get_assemblies = (t_get_assemblies)sym(h, "domain_get_assemblies");
              auto asm_image = (t_asm_image)sym(h, "assembly_get_image");
              auto class_from_name = (t_class_from_name)sym(h, "class_from_name");
              auto method_from_name = (t_method_from_name)sym(h, "class_get_method_from_name");
              auto runtime_invoke = (t_runtime_invoke)sym(h, "runtime_invoke");
              auto field_static_get = (t_field_static_get)sym(h, "field_static_get_value");
              auto class_get_field = (t_class_get_field)sym(h, "class_get_field_from_name");
              void* domain = nullptr;
              for (int i = 0; i < 180 && !domain; i++) { domain = domain_get(); if (!domain) sleep(1); }
              thread_attach(domain);
              void* pcClass = nullptr;
              void* debugDrawLine = nullptr;
              size_t n = 0;
              void** asms = get_assemblies(domain, &n);
              for (size_t i = 0; i < n; i++) {
                  void* img = asm_image(asms[i]);
                  if (!pcClass) pcClass = class_from_name(img, "", "PlayerControl");
                  void* dbg = class_from_name(img, "UnityEngine", "Debug");
                  if (dbg && !debugDrawLine) debugDrawLine = method_from_name(dbg, "DrawLine", 4);
                  if (dbg && !debugDrawLine) debugDrawLine = method_from_name(dbg, "DrawLine", 3);
              }
              if (!pcClass || !debugDrawLine) return nullptr;
              void* localPlayerField = class_get_field(pcClass, "LocalPlayer");
              void* getTruePosMethod = method_from_name(pcClass, "GetTruePosition", 0);
              __android_log_print(ANDROID_LOG_INFO, TAG, "Hitbox ON!");
              while (true) {
                  void* localPlayer = nullptr;
                  if (localPlayerField) field_static_get(localPlayerField, &localPlayer);
                  if (localPlayer && getTruePosMethod) {
                      void* exc = nullptr;
                      void* ret = runtime_invoke(getTruePosMethod, localPlayer, nullptr, &exc);
                      if (ret && !exc) {
                          float* pos = (float*)((char*)ret + 16);
                          float px = pos[0], py = pos[1];
                          for (int circle = 0; circle < 2; circle++) {
                              float radius = (circle == 0) ? 0.4f : 1.8f;
                              Color4 col = (circle == 0) ? Color4{0,1,0,1} : Color4{1,0,0,1};
                              for (int i = 0; i < 32; i++) {
                                  float a1 = (float)i / 32 * 6.28318f;
                                  float a2 = (float)(i+1) / 32 * 6.28318f;
                                  Vec3 p1{px + cosf(a1)*radius, py + sinf(a1)*radius, 0};
                                  Vec3 p2{px + cosf(a2)*radius, py + sinf(a2)*radius, 0};
                                  void* args[4];
                                  args[0] = &p1; args[1] = &p2; args[2] = &col;
                                  float dur = 0.1f; args[3] = &dur;
                                  void* e2 = nullptr;
                                  runtime_invoke(debugDrawLine, nullptr, args, &e2);
                              }
                          }
                      }
                  }
                  usleep(100000);
              }
              return nullptr;
          }
          CREW_MOD_ENTRY {
              g_vm = api->vm;
              pthread_t t;
              if (pthread_create(&t, nullptr, worker, nullptr) == 0) pthread_detach(t);
          }
          EOF
          echo '{"id":"hitbox.viewer","name":"Hitbox Viewer","version":"1.0.0","author":"Heoga"}' > mod.json

      - name: Compilar
        run: |
          cd mod
          NDK=${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}
          BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          mkdir -p out/arm64-v8a out/armeabi-v7a
          FLAGS="-shared -fPIC -O2 -nostdlib++ -fno-exceptions -fno-rtti"
          $BIN/aarch64-linux-android28-clang++ $FLAGS -Wl,-z,max-page-size=16384 mod.cpp -o out/arm64-v8a/libhitbox.so -llog -ldl
          $BIN/armv7a-linux-androideabi28-clang++ $FLAGS mod.cpp -o out/armeabi-v7a/libhitbox.so -llog -ldl

      - name: Empaquetar .crewag
        run: |
          cd mod
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("hitbox.crewag", "w", zipfile.ZIP_DEFLATED) as z:
              z.write("mod.json", "mod.json")
              z.write("out/arm64-v8a/libhitbox.so", "lib/arm64-v8a/libhitbox.so")
              z.write("out/armeabi-v7a/libhitbox.so", "lib/armeabi-v7a/libhitbox.so")
          PY

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hitbox-${{ github.run_number }}
          name: Hitbox Viewer ${{ github.run_number }}
          files: mod/hitbox.crewag
